name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Artifacts & Calculate Checksums
        run: |
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="latest"
          fi
          
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/ClassRoot-${VERSION}.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/ClassRoot-${VERSION}-debug.apk
          
          cd dist
          sha256sum ClassRoot-*.apk > checksums.txt
          cat checksums.txt

      - name: Upload Build Artifacts (Actions Run)
        uses: actions/upload-artifact@v4
        with:
          name: ClassRoot-APK-${{ github.ref_name || 'manual' }}
          path: dist/*
          retention-days: 14

      - name: Create GitHub Release & Publish APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "ClassRoot Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/ClassRoot-*.apk
            dist/checksums.txt
